                    // 픽 — 세움 (제일 좁다)
                    let gsLastK = null;
                    function gsPiece(level) {
                        const w = Math.max(14, 150 * Math.pow(0.962, level));
                        // 한 층마다 약 4%씩 (한 번에는 티가 안 난다)
                        const b = GS_BANDS.find(x => w >= x.min) || GS_BANDS[GS_BANDS.length - 1];
                        const have = b.opts.filter(o => GS.imgs[o.k]);
                        // 실제로 들어와 있는 그림만
                        let pool = have.length ? have : [b.opts[0]];
                        if (pool.length > 1) {
                            const nd = pool.filter(o => o.k !== gsLastK);
                            if (nd.length)
                                pool = nd;
                        }
                        // 같은 그림 연달아 나오지 않게
                        const o = pool[rnd(pool.length)];
                        gsLastK = o.k;
                        return {
                            k: o.k,
                            rot: o.rot,
                            w: Math.round(w)
                        };
                    }
                    function engGlassStack(done) {
                        fpLoad();
                        gsLoad();
                        stage.innerHTML = '<canvas id="hh_gscv" width="400" height="480"></canvas>' + '<button class="btn amber bigbtn" id="hh_gsDrop">STACK!</button>';
                        const cv = $('gscv')
                          , ctx = cv.getContext('2d')
                          , btn = $('gsDrop');
                        const CX = 200
                          , BASEY = 430
                          , TRAYW = 200
                          , ARM = 1100;

                          , stT = 0
                          , t0 = 0
                          , lastT = 0
                          , raf = 0
                          , shake = 0
                          , ended = false;

                          , cur = null
                          , camY = 0
                          , camWant = 0
                          , level = 0
                          , lean = 0
                          , stampObj = null
                          , stampT = 0
                          , endTxt = '';
                        const parts = []
                          , fallers = [];
                        function sizeOf(k, w, rot) {
                            const im = GS.imgs[k];
                            if (!im)
                                return {
                                    w: w,
                                    h: Math.max(8, Math.round(w * 0.3))
                                };
                            const ar = rot ? (im.width / im.height) : (im.height / im.width);
                            // 90도 돌리면 가로세로가 바뀐다
                            return {
                                w: w,
                                h: Math.max(8, Math.round(w * ar))
                            };
                        }
                        function topOf() {
                            return stack.length ? stack[stack.length - 1] : {
                                x: CX,
                                w: TRAYW,
                                y: BASEY,
                                h: 0
                            };
                        }
                        function spawn() {
                            const s = gsPiece(level)
                              , d = sizeOf(s.k, s.w, s.rot)
                              , top = topOf();
                            const cx0 = Math.max(70, Math.min(330, top.x));
                            // 화면 가운데가 아니라 탑 위를 기준으로 흔들린다
                            cur = {
                                k: s.k,
                                rot: s.rot,
                                w: d.w,
                                h: d.h,
                                y: top.y - d.h,
                                x: cx0,
                                cx0: cx0,
                                ph: Math.random() * 6.283,
                                sp: 1.03 + level * 0.06,
                                amp: Math.min(150, 80 + level * 3.5)
                            };
                            // 시작 속도 25% 올림. 좁아지는 것만으로도 어려우니 가속은 완만하게
                        }
                        function place() {
                            if (state !== 'play' || stampObj || !cur)
                                return;
                            const top = topOf()
                              , dx = cur.x - top.x;
                            const over = Math.min(cur.x + cur.w / 2, top.x + top.w / 2) - Math.max(cur.x - cur.w / 2, top.x - top.w / 2);
                            const need = Math.min(cur.w, top.w) * 0.30;
                            // 이만큼은 걸쳐야 버틴다
                            if (over < need) {
                                // 못 걸치면 미끄러져 떨어진다
                                fallers.push({
                                    k: cur.k,
                                    rot: cur.rot,
                                    x: cur.x,
                                    y: cur.y,
                                    w: cur.w,
                                    h: cur.h,
                                    vx: (dx >= 0 ? 1 : -1) * 90,
                                    vy: -40,
                                    spin: 0,
                                    vs: (dx >= 0 ? 4 : -4)
                                });
                                cur = null;
                                shake = 10;
                                sBad();
                                finish('SLID OFF');
                                return;
                            }
                            const acc = Math.abs(dx);
                            stack.push({
                                k: cur.k,
                                rot: cur.rot,
                                x: cur.x,
                                w: cur.w,
                                h: cur.h,
                                y: cur.y

                                    });
                            } else if (acc < 16)
                                beep(900, 0.07, 'square', 0.09);
                            else
                                beep(520, 0.07, 'square', 0.08);
                            if (Math.abs(lean) > TRAYW * 0.45) {
                                // 무게중심이 쟁반을 벗어나면 와르르
                                shake = 13;

                                  , n = stack.length;
                                stack.forEach( (b, i) => {

                                    const hi = i / Math.max(1, n - 1);

                                    fallers.push({
                                        k: b.k,

                                }
                                if (keys.ArrowLeft || keys.a)
                                    ix = -1;
                                if (keys.ArrowRight || keys.d)

                                if (keys.ArrowUp || keys.w)

                                me.vx = ix * SPD;

                            // 35% 축소

                                const blink = inv > 0 && (Math.floor(t / 90) % 2 === 0);
                                if (!blink) {
                                    drawSprite('waiter', me.x, me.y, 35, me.ang);

                                    // 쟁반 위의 잔 = 남은 목숨

                                    ctx.translate(me.x, me.y);

                                ctx.fillText(stampObj.quip, 201, 283);

                    /* ====================== FLY SWAT ====================== */
                    // 과일 바구니에 꼬이는 파리들을 탭 사격으로 잡아라 — 인트로: 큰 파리가 윙윙 돌다 바구니에 앉는 순간 펑!
                    const FS = {

                    function fsLoad() {
                        if (FS.loading)

                        const srcs = {
                            logo: ['fs_logo', 600],
                            bigfly: ['fs_bigfly', 420],
                            fly1: ['fs_fly1', 260],
                            fly2: ['fs_fly2', 260],
                            basket: ['fs_basket', 520],
                            basket2: ['fs_basket2', 520],
                            basket3: ['fs_basket3', 520]
                        };
                        Object.keys(srcs).forEach(k => {
                            const im = new Image();
                            im.onload = () => {
                                FS.imgs[k] = fpKey(im, srcs[k][1], srcs[k][2], srcs[k][3]);
                            }
                            ;
                            im.src = 'assets/' + srcs[k][0] + '.png';
                        }
                        );
                    }
                    function fsBuzz() {
                        const a = ac();

                            return null;

                            const o = a.createOscillator()
                              , g = a.createGain();
                            o.type = 'sawtooth';
                            o.frequency.value = 170;
                            g.gain.value = 0.0001;
                            o.connect(g);
                            g.connect(a.destination);
                            o.start();

                                set: (on, f) => {
                                    if (window.__mute)
                                        on = false;
                                    const t = a.currentTime;
                                    g.gain.setTargetAtTime(on ? 0.035 : 0.0001, t, 0.06);
                                    o.frequency.setTargetAtTime(f, t, 0.05);
                                }
                                ,
                                kill: () => {
                                    try {
                                        o.stop();
                                    } catch (e) {}
                                }
                            };
                            (window.__noises = window.__noises || []).push(ret);
                            return ret;
                        } catch (e) {
                            return null;
                        }
                    }
                    function engFlySwat(done) {

                        const cv = $('fpcv')
                          , ctx = cv.getContext('2d');

                          , BY = 352
                          , TOTAL = 25000;

                          , stT = 0
                          , pts = 0

                          , lastT = 0

                        function shoot(e) {

                            crossY = y;

                            shake = Math.max(shake, 2.5);

                            let best = -1

                        cv.addEventListener('pointerdown', shoot);

                                  , left = Math.max(0, TOTAL - elapsed)
                                  , rush = elapsed > TOTAL - 4200;

                    /* ====================== ORDER UP! ====================== */
                    // 손님들이 말풍선으로 부르는 칵테일 주문을 순서대로 기억해 포스기에 입력 — 4잔부터 시작, 틀릴 때까지 무한
                    const OU = {

                    function ouLoad() {

                    function engOrderUp(done) {

                        const PW = 460
                          , PX = -30
                          , PY = 22
                          , SFX0 = 0.118
                          , SFX1 = 0.772
                          , SFY0 = 0.262
                          , SFY1 = 0.832;
                        let state = 'intro'
                          , stT = 0
                          , round = 1
                          , seq = []
                          , showIdx = 0
                          , input = []
                          , cleared = 0;

                          , stampT = 0

                          , raf = 0

                        function itemDur() {

                        function btnRect(i) {

                            // 파티클
                            for (let i = parts.length - 1; i >= 0; i--) {
                                const pp2 = parts[i];
                                pp2.life -= dt;
                                if (pp2.life <= 0) {
                                    parts.splice(i, 1);
                                    continue;
                                }
                                pp2.vy += pp2.gv * dt;
                                pp2.x += pp2.vx * dt;
                                pp2.y += pp2.vy * dt;
                                ctx.globalAlpha = Math.min(1, pp2.life * 2.5);
                                ctx.fillStyle = pp2.c;
                                ctx.fillRect(pp2.x - pp2.r / 2, pp2.y - pp2.r / 2, pp2.r, pp2.r);
                            }
                            ctx.globalAlpha = 1;
                            // HUD
                            if (state !== 'intro') {
                                ctx.font = '10px "Press Start 2P"';
                                ctx.textAlign = 'left';
                                ctx.fillStyle = '#000';
                                ctx.fillText('ROUND ' + round, 14, 30);
                                ctx.fillStyle = '#ffd977';
                                ctx.fillText('ROUND ' + round, 12, 28);
                                ctx.textAlign = 'right';
                                ctx.fillStyle = '#000';
                                ctx.fillText('BEST ' + best, 390, 30);
                                ctx.fillStyle = '#8a8d82';
                                ctx.fillText('BEST ' + best, 388, 28);
                            }
                            // 인트로
                            if (state === 'intro') {
                                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                                ctx.fillRect(0, 0, 400, 480);
                                const lg2 = OU.imgs.logo;
                                if (lg2) {
                                    const k = 0.55 + eob2(Math.min(1, el2 / 280)) * 0.45
                                      , lw = 330 * k
                                      , lh = lw * (lg2.height / lg2.width);
                                    ctx.drawImage(lg2, 200 - lw / 2, 210 - lh / 2, lw, lh);
                                }
                            }
                            // 클리어/실패 스탬프
                            if (state === 'clear') {
                                ctx.save();
                                ctx.translate(200, 120);
                                ctx.rotate(-0.05);
                                const k2 = 1 + Math.max(0, 1 - el2 / 160) * 1.3;
                                ctx.scale(k2, k2);
                                ctx.font = '20px "Press Start 2P"';
                                ctx.textAlign = 'center';
                                ctx.fillStyle = '#000';
                                ctx.fillText('ROUND CLEAR!', 3, 3);
                                ctx.fillStyle = '#6fcf8f';
                                ctx.fillText('ROUND CLEAR!', 0, 0);
                                ctx.restore();
                            }
                            if (state === 'fail') {
                                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                                ctx.fillRect(0, 0, 400, 480);
                                ctx.save();
                                ctx.translate(200, 150);
                                ctx.rotate(-0.06);
                                const k2 = 1 + Math.max(0, 1 - el2 / 180) * 1.4;
                                ctx.scale(k2, k2);
                                ctx.font = '19px "Press Start 2P"';
                                ctx.textAlign = 'center';
                                ctx.fillStyle = '#000';
                                ctx.fillText('WRONG ORDER!', 3, 3);
                                ctx.fillStyle = '#d9544d';
                                ctx.fillText('WRONG ORDER!', 0, 0);
                                ctx.restore();
                                // 전체 정답 시퀀스 공개: 맞춘 잔=초록, 틀린 지점=빨강, 나머지=회색
                                ctx.font = '9px "Press Start 2P"';
                                ctx.textAlign = 'center';
                                ctx.fillStyle = '#000';
                                ctx.fillText('THE FULL ORDER WAS:', 202, 197);
                                ctx.fillStyle = '#fff';
                                ctx.fillText('THE FULL ORDER WAS:', 200, 195);
                                const nI = seq.length
                                  , cols = Math.min(5, nI)
                                  , iS = 46
                                  , gap = 8;
                                for (let i = 0; i < nI; i++) {
                                    const cx2 = 200 - (cols * (iS + gap) - gap) / 2 + (i % 5) * (iS + gap);
                                    const cy2 = 208 + Math.floor(i / 5) * (iS + gap + 6);
                                    const okd = i < input.length
                                      , missIdx = i === input.length;
                                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                                    ctx.fillRect(cx2, cy2, iS, iS);
                                    ctx.strokeStyle = okd ? '#6fcf8f' : (missIdx ? '#d9544d' : '#555');
                                    ctx.lineWidth = missIdx ? 4 : 2;
                                    ctx.strokeRect(cx2, cy2, iS, iS);
                                    const ck2 = OU.imgs['ck' + seq[i]];
                                    if (ck2)
                                        ctx.drawImage(ck2, cx2 + 3, cy2 + 3, iS - 6, iS - 6);
                                }
                                const myY = 208 + Math.ceil(nI / 5) * (iS + gap + 6) + 22;
                                ctx.font = '9px "Press Start 2P"';
                                ctx.fillStyle = '#000';
                                ctx.fillText('MISSED: ' + OU_MENU[wrongCk], 202, myY + 2);
                                ctx.fillStyle = '#d9544d';
                                ctx.fillText('MISSED: ' + OU_MENU[wrongCk], 200, myY);
                                ctx.font = '12px "Press Start 2P"';
                                ctx.fillStyle = '#000';
                                ctx.fillText('ROUNDS CLEARED: ' + cleared, 202, myY + 28);
                                ctx.fillStyle = '#ffd977';
                                ctx.fillText('ROUNDS CLEARED: ' + cleared, 200, myY + 26);
                            }
                        }
                        raf = requestAnimationFrame(draw);
                    }

                    /* ====================== WHERE IS MY SHOT? ====================== */
                    // 야바위: 샷잔이 뚜껑에 숨고 섞인다 — 맞히면 다음 라운드(뚜껑 2→5개, 점점 빠름), 틀리면 끝
                    const WS = {
                        imgs: {},
                        loading: false
                    };
                    function wsLoad() {
                        if (WS.loading)
                            return;
                        WS.loading = true;
                        const srcs = {
                            cover: ['ws_cover', 420, 185],
                            shot: ['ws_shot', 260, 185],
                            logo: ['ws_logo', 560]
                        };
                        Object.keys(srcs).forEach(k => {
                            const im = new Image();
                            im.onload = () => {
                                WS.imgs[k] = fpKey(im, srcs[k][1], srcs[k][2], srcs[k][3]);
                            }
                            ;
                            im.src = 'assets/' + srcs[k][0] + '.png';
                        }
                        );
                    }
                    function engWhereShot(done) {
                        fpLoad();
                        wsLoad();
                        stage.innerHTML = '<canvas id="hh_fpcv" width="400" height="480"></canvas>';
                        const cv = $('fpcv')
                          , ctx = cv.getContext('2d');
                        const CY = 318
                          , ARM = 1300;
                        let state = 'intro'
                          , stT = 0
                          , round = 1
                          , nCups = 2
                          , shotAt = 0
                          , picked = -1
                          , cleared = 0;
                        let cups = []
                          , swaps = []
                          , swapI = 0
                          , swapT = 0
                          , swapDur = 420
                          , lift = 0;
                        let t0 = 0
                          , lastT = 0
                          , raf = 0
                          , shake = 0
                          , finished = false
                          , ended = false;
                        let best = parseInt(localStorage.getItem('pine_wis_best') || '0') || 0;
                        const parts = [];
                        function cupX(slot, n) {
                            const sp = Math.min(96, 340 / Math.max(1, n - 1));
                            return 200 + (slot - (n - 1) / 2) * sp;
                        }
                        function cupW(n) {
                            return Math.min(96, 340 / Math.max(1, n - 1)) - 6 < 74 ? 68 : 88;
                        }
                        function newRound() {
                            nCups = Math.min(5, 1 + round);
                            shotAt = rnd(nCups);
                            picked = -1;
                            cups = [];
                            for (let i = 0; i < nCups; i++)
                                cups.push({
                                    slot: i
                                });
                            const nSw = 2 + round * 2;
                            swaps = [];
                            swapDur = Math.max(170, 460 - round * 55);
                            for (let i = 0; i < nSw; i++) {
                                let a = rnd(nCups), b;
                                do {
                                    b = rnd(nCups);
                                } while (b === a);
                                swaps.push([a, b]);
                            }
                            swapI = 0;
                            state = 'place';
                            stT = lastT;
                            lift = 1;
                            beep(520, 0.08, 'square', 0.1);
                        }
                        function tap(e) {
                            e.preventDefault();
                            ac();
                            if (state !== 'pick' || finished)
                                return;
                            const r = cv.getBoundingClientRect();
                            const x = (e.clientX - r.left) * (400 / r.width)
                              , y = (e.clientY - r.top) * (480 / r.height);
                            const cw2 = cupW(nCups);
                            for (let s = 0; s < nCups; s++) {
                                const cx2 = cupX(s, nCups);
                                if (Math.abs(x - cx2) < cw2 / 2 + 8 && y > CY - 90 && y < CY + 30) {
                                    picked = s;
                                    state = 'reveal';
                                    stT = lastT;
                                    if (s === shotAt) {
                                        cleared = round;
                                        sGood();
                                        flash('#6fcf8f');
                                        for (let j = 0; j < 16; j++)
                                            parts.push({
                                                x: cx2,
                                                y: CY - 40,
                                                vx: (Math.random() * 2 - 1) * 130,
                                                vy: -70 - Math.random() * 130,
                                                gv: 500,
                                                r: 2 + Math.random() * 2.4,
                                                c: ['#ffd977', '#6fcf8f', '#fff'][rnd(3)],
                                                life: 0.5
                                            });
                                    } else {
                                        finished = true;
                                        sBad();
                                        flash('#d9544d');
                                        shake = 9;
                                        if (cleared > best) {
                                            best = cleared;
                                            localStorage.setItem('pine_wis_best', String(best));
                                        }
                                        const sc = Math.min(100, cleared * 22)
                                          , cls = cleared >= 4 ? 'perfect' : (cleared >= 2 ? 'good' : 'miss');
                                        setTimeout( () => {
                                            if (ended)
                                                return;
                                            ended = true;
                                            cleanup();
                                            done(sc, 'ROUND ' + round + ' KO', cls);
                                        }
                                        , 2300);
                                    }
                                    return;
                                }
                            }
                        }
                        cv.addEventListener('pointerdown', tap);
                        function cleanup() {
                            cancelAnimationFrame(raf);
                        }
                        function slotNow(i) {
                            // 셔플 애니메이션 중 커버 i의 현재 x (슬롯 교환 보간)
                            return cupX(cups[i].slot, nCups);
                        }
                        function draw(t) {
                            raf = requestAnimationFrame(draw);
                            if (!t0) {
                                t0 = t;
                                lastT = t;
                                stT = t;
                            }
                            const dt = Math.min(0.05, (t - lastT) / 1000);
                            lastT = t;
                            const el2 = t - stT;
                            if (state === 'intro' && el2 >= ARM)
                                newRound();
                            if (state === 'place' && el2 >= 2100) {
                                state = 'shuffle';
                                stT = t;
                                swapT = t;
                            }
                            if (state === 'shuffle') {
                                if (t - swapT >= swapDur) {
                                    const [a,b] = swaps[swapI];
                                    // 슬롯 교환 확정
                                    for (const c of cups) {
                                        if (c.slot === a)
                                            c.slot = b;
                                        else if (c.slot === b)
                                            c.slot = a;
                                    }
                                    if (shotAt === a)
                                        shotAt = b;
                                    else if (shotAt === b)
                                        shotAt = a;
                                    swapI++;
                                    swapT = t;
                                    beep(280 + rnd(60), 0.04, 'square', 0.07);
                                    if (swapI >= swaps.length) {
                                        state = 'pick';
                                        stT = t;
                                        beep(900, 0.1, 'square', 0.1);
                                    }
                                }
                            }
                            if (state === 'reveal' && picked === shotAt && el2 >= 1400) {
                                round++;
                                newRound();
                            }
                            shake = Math.max(0, shake - dt * 26);
                            ctx.setTransform(1, 0, 0, 1, 0, 0);
                            ctx.clearRect(0, 0, 400, 480);
                            ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
                            const bgi = GB.imgs.whereshot || FP.imgs.bg;
                            if (bgi) {
                                const s = Math.max(400 / bgi.width, 480 / bgi.height);
                                ctx.drawImage(bgi, (400 - bgi.width * s) / 2, (480 - bgi.height * s) / 2, bgi.width * s, bgi.height * s);
                            } else {
                                ctx.fillStyle = '#14170f';
                                ctx.fillRect(0, 0, 400, 480);
                            }
                            ctx.fillStyle = 'rgba(0,0,0,0.34)';
                            ctx.fillRect(0, 0, 400, 480);
                            // 카운터 상판
                            const ct3 = ctx.createLinearGradient(0, CY + 8, 0, CY + 30);
                            ct3.addColorStop(0, '#7a5a34');
                            ct3.addColorStop(1, '#4e3620');
                            ctx.fillStyle = ct3;
                            ctx.fillRect(0, CY + 8, 400, 22);
                            ctx.fillStyle = '#8a6a40';
                            ctx.fillRect(0, CY + 8, 400, 3);
                            const cf4 = ctx.createLinearGradient(0, CY + 30, 0, 480);
                            cf4.addColorStop(0, '#3a2817');
                            cf4.addColorStop(1, '#1a1005');
                            ctx.fillStyle = cf4;
                            ctx.fillRect(0, CY + 30, 400, 480 - CY - 30);
                            if (state !== 'intro') {
                                const cw2 = cupW(nCups)
                                  , sh2 = WS.imgs.shot
                                  , cvr = WS.imgs.cover;
                                // 샷잔 (배치/공개 때 보임)
                                const showShot = state === 'place' || (state === 'reveal');
                                if (sh2 && showShot) {
                                    const sx2 = cupX(shotAt, nCups)
                                      , ssz = cw2 * 0.62;
                                    ctx.save();
                                    ctx.globalAlpha = 0.35;
                                    ctx.fillStyle = '#000';
                                    ctx.beginPath();
                                    ctx.ellipse(sx2, CY + 12, ssz * 0.42, 7, 0, 0, 6.283);
                                    ctx.fill();
                                    ctx.restore();
                                    ctx.drawImage(sh2, sx2 - ssz / 2, CY - ssz + 12, ssz, ssz * (sh2.height / sh2.width));
                                }
                                // 뚜껑들
                                if (cvr) {
                                    for (let i = 0; i < cups.length; i++) {
                                        const c = cups[i];
                                        let cx2 = cupX(c.slot, nCups)
                                          , lY = 0
                                          , sc3 = 1;
                                        // 셔플 이동 보간
                                        if (state === 'shuffle' && swapI < swaps.length) {
                                            const [a,b] = swaps[swapI];
                                            const p2 = Math.min(1, (t - swapT) / swapDur);
                                            const e2 = 0.5 - 0.5 * Math.cos(p2 * Math.PI);
                                            if (c.slot === a) {
                                                cx2 = cupX(a, nCups) + (cupX(b, nCups) - cupX(a, nCups)) * e2;
                                                lY = -Math.sin(p2 * Math.PI) * 13;
                                            } else if (c.slot === b) {
                                                cx2 = cupX(b, nCups) + (cupX(a, nCups) - cupX(b, nCups)) * e2;
                                                lY = Math.sin(p2 * Math.PI) * 10;
                                            }
                                        }
                                        // 배치 단계: 뚜껑이 내려와 덮음 / 공개: 선택 뚜껑(+정답 뚜껑) 들림
                                        if (state === 'place') {
                                            const p2 = Math.min(1, Math.max(0, (el2 - 600) / 500));
                                            lY = -(1 - eob2(p2)) * 140;
                                        }
                                        // 샷 먼저 보여주고 뚜껑이 내려와 덮음
                                        if (state === 'reveal') {
                                            const p2 = Math.min(1, el2 / 300);
                                            if (c.slot === picked)
                                                lY = -eob2(p2) * 95;
                                            if (finished && c.slot === shotAt)
                                                lY = -eob2(Math.max(0, Math.min(1, (el2 - 350) / 300))) * 95;
                                        }
                                        if (state === 'pick') {
                                            lY = Math.sin(t / 300 + i) * 2;
                                        }
                                        const ch2 = cw2 * (cvr.height / cvr.width);
                                        ctx.save();
                                        ctx.globalAlpha = 0.3;
                                        ctx.fillStyle = '#000';
                                        ctx.beginPath();
                                        ctx.ellipse(cx2, CY + 14, cw2 * 0.46, 8, 0, 0, 6.283);
                                        ctx.fill();
                                        ctx.restore();
                                        ctx.drawImage(cvr, cx2 - cw2 / 2, CY - ch2 + 16 + lY, cw2, ch2);
                                    }
                                }
                            }
                            for (let i = parts.length - 1; i >= 0; i--) {
                                const pp2 = parts[i];
                                pp2.life -= dt;
                                if (pp2.life <= 0) {
                                    parts.splice(i, 1);
                                    continue;
                                }
                                pp2.vy += pp2.gv * dt;
                                pp2.x += pp2.vx * dt;
                                pp2.y += pp2.vy * dt;
                                ctx.globalAlpha = Math.min(1, pp2.life * 2.5);
                                ctx.fillStyle = pp2.c;
                                ctx.fillRect(pp2.x - pp2.r / 2, pp2.y - pp2.r / 2, pp2.r, pp2.r);
                            }
                            ctx.globalAlpha = 1;
                            // HUD
                            if (state !== 'intro') {
                                ctx.font = '10px "Press Start 2P"';
                                ctx.textAlign = 'left';
                                ctx.fillStyle = '#000';
                                ctx.fillText('ROUND ' + round, 14, 30);
                                ctx.fillStyle = '#ffd977';
                                ctx.fillText('ROUND ' + round, 12, 28);
                                ctx.textAlign = 'right';
                                ctx.fillStyle = '#000';
                                ctx.fillText('BEST ' + best, 390, 30);
                                ctx.fillStyle = '#8a8d82';
                                ctx.fillText('BEST ' + best, 388, 28);
                                ctx.textAlign = 'center';
                                ctx.font = '11px "Press Start 2P"';
                                const msg = (state === 'place' && el2 < 1100) ? 'WATCH THE SHOT!' : (state === 'shuffle' ? 'FOLLOW IT!' : (state === 'pick' ? 'WHERE IS IT? TAP!' : ''));
                                if (msg) {
                                    ctx.fillStyle = '#000';
                                    ctx.fillText(msg, 202, 142);
                                    ctx.fillStyle = '#ffd977';
                                    ctx.fillText(msg, 200, 140);
                                }
                                if (state === 'place' && el2 >= 1150) {
                                    const k2 = 1 + Math.max(0, 1 - (el2 - 1150) / 180) * 1.4;
                                    // 뚜껑이 덮이면 FIND IT! 팝
                                    ctx.save();
                                    ctx.translate(200, 150);
                                    ctx.rotate(-0.05);
                                    ctx.scale(k2, k2);
                                    ctx.font = '24px "Press Start 2P"';
                                    ctx.fillStyle = '#000';
                                    ctx.fillText('FIND IT!', 3, 3);
                                    ctx.fillStyle = '#ffd977';
                                    ctx.fillText('FIND IT!', 0, 0);
                                    ctx.restore();
                                }
                            }
                            if (state === 'intro') {
                                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                                ctx.fillRect(0, 0, 400, 480);
                                const lg2 = WS.imgs.logo;
                                if (lg2) {
                                    const k = 0.55 + eob2(Math.min(1, el2 / 280)) * 0.45
                                      , lw = 330 * k
                                      , lh = lw * (lg2.height / lg2.width);
                                    ctx.drawImage(lg2, 200 - lw / 2, 215 - lh / 2, lw, lh);
                                }
                            }
                            if (state === 'reveal') {
                                ctx.font = '18px "Press Start 2P"';
                                ctx.textAlign = 'center';
                                if (picked === shotAt) {
                                    ctx.save();
                                    ctx.translate(200, 180);
                                    ctx.rotate(-0.05);
                                    const k2 = 1 + Math.max(0, 1 - el2 / 160) * 1.3;
                                    ctx.scale(k2, k2);
                                    ctx.fillStyle = '#000';
                                    ctx.fillText('FOUND IT!', 3, 3);
                                    ctx.fillStyle = '#6fcf8f';
                                    ctx.fillText('FOUND IT!', 0, 0);
                                    ctx.restore();
                                } else {
                                    ctx.save();
                                    ctx.translate(200, 180);
                                    ctx.rotate(-0.06);
                                    const k2 = 1 + Math.max(0, 1 - el2 / 180) * 1.4;
                                    ctx.scale(k2, k2);
                                    ctx.fillStyle = '#000';
                                    ctx.fillText('NOT THERE!', 3, 3);
                                    ctx.fillStyle = '#d9544d';
                                    ctx.fillText('NOT THERE!', 0, 0);
                                    ctx.restore();
                                    ctx.font = '12px "Press Start 2P"';
                                    ctx.fillStyle = '#000';
                                    ctx.fillText('ROUNDS CLEARED: ' + cleared, 202, 432);
                                    ctx.fillStyle = '#ffd977';
                                    ctx.fillText('ROUNDS CLEARED: ' + cleared, 200, 430);
                                }
                            }
                        }
                        raf = requestAnimationFrame(draw);
                    }

                    /* ====================== FRESH SQUEEZE ====================== */
                    // 라임을 가져와 썰고, 반쪽을 스퀴저에 넣고 눌러 짜서 계량컵을 채워라 — 30초, 라임 1개=50ml
                    const SQ = {
                        imgs: {},
                        loading: false
                    };
                    function sqLoad() {
                        if (SQ.loading)
                            return;
                        SQ.loading = true;
                        const names = ['basket', 'board', 'closed', 'cup', 'half', 'lime', 'logo', 'open', 'spent', 'trash'];
                        names.forEach(k => {
                            const im = new Image();
                            im.onload = () => {
                                SQ.imgs[k] = fpKey(im, k === 'logo' ? 560 : 400, 185, k === 'logo');
                            }
                            ;
                            im.src = 'assets/sq_' + k + '.png';
                        }
                        );
                    }
                    function engSqueeze(done) {
                        fpLoad();
                        sqLoad();
                        stage.innerHTML = '<canvas id="hh_fpcv" width="400" height="480"></canvas>';
                        const cv = $('fpcv')
                          , ctx = cv.getContext('2d');
                        const ARM = 1300
                          , TOTAL = 30000;
                        // 스테이션 좌표
                        const BK = {
                            x: 58,
                            y: 300
                        }
                          , BD = {
                            x: 175,
                            y: 398
                        }
                          , SZ = {
                            x: 292,
                            y: 186
                        }
                          , CUP = {
                            x: 319,
                            y: 306
                        }
                          , TR = {
                            x: 334,
                            y: 492
                        };
                        // 도마=하단 식탁 위, 바구니=도마 왼쪽, 휴지통=하단에 머리 크게
                        let state = 'intro'
                          , stT = 0
                          , phase = 'grab'
                          , halves = 0
                          , ml = 0
                          , shownMl = 0
                          , pressT = -1e9
                          , cutT = -1e9;
                        let flyObj = null;
                        // {img,from,to,t,cb}
                        let t0 = 0
                          , lastT = 0
                          , raf = 0
                          , shake = 0
                          , finished = false
                          , ended = false
                          , ptr = null;
                        const parts = [];
                        function fly(img, from, to, cb) {
                            flyObj = {
                                img,
                                fx: from.x,
                                fy: from.y,
                                tx: to.x,
                                ty: to.y,
                                t: now(),

                        ), 28000);
                    }
                    // 타이틀 3종은 투명 원본 그대로 사용 (드롭 인 연출은 titleIntro)
                    (function() {
                        // 게임 선택 화면 타이틀(투명 재작업본 그대로) / 리본(흰 배경이라 키잉)
                        // (PICK A GAME 화면 삭제 — 타이틀 목록으로 통합)
                        // SET YOUR RECORDS 리본은 새 이미지(records_ribbon.png)를 그대로 사용
                        // 버튼 이미지 (키잉 후 텍스트 버튼과 교체)
                        [['bp_btn_rank', 'rankImg', 'rankBtn'], ['bp_btn_set', 'setImg', 'setBtn']].forEach( ([src,imgId,btnId]) => {
                            const B = new Image();
                            B.onload = () => {
                                try {
                                    const c = fpKeyUI(B, 560);
                                    const el = $(imgId);
                                    el.src = c.toDataURL();
                                    el.style.display = 'block';
                                    $(btnId).style.display = 'none';
                                    el.addEventListener('pointerdown', e => {
                                        e.preventDefault();
                                        $(btnId).onclick();
                                    }
                                    );
                                } catch (e) {}
                            }
                            ;
                            B.src = 'assets/' + src + '.png';
                        }
                        );
                        // 장식 스트립: 아이템별로 쪼개서 타이틀에서 통통 튀는 물리 데코
                        const D = new Image();
                        D.onload = () => {
                            try {
                                const key = fpKeyUI(D, 900);
                                const w = key.width
                                  , h = key.height;
                                const d = key.getContext('2d').getImageData(0, 0, w, h).data;
                                const colHas = new Uint8Array(w);
                                for (let cx = 0; cx < w; cx++) {
                                    for (let cy = 0; cy < h; cy++) {
                                        if (d[(cy * w + cx) * 4 + 3] > 30) {
                                            colHas[cx] = 1;
                                            break;
                                        }
                                    }
                                }
                                const runs = [];
                                let s = -1;
                                for (let cx = 0; cx <= w; cx++) {
                                    const on = cx < w && colHas[cx];
                                    if (on && s < 0)
                                        s = cx;
                                    else if (!on && s >= 0) {
                                        if (cx - s > 10)
                                            runs.push([s, cx]);
                                        s = -1;
                                    }
                                }
                                const sprites = runs.map(rr => {
                                    let top = h - 1
                                      , bot = 0;
                                    for (let cy = 0; cy < h; cy++) {
                                        for (let cx = rr[0]; cx < rr[1]; cx++) {
                                            if (d[(cy * w + cx) * 4 + 3] > 30) {
                                                if (cy < top)
                                                    top = cy;
                                                if (cy > bot)
                                                    bot = cy;
                                                break;
                                            }
                                        }
                                    }
                                    const c2 = document.createElement('canvas');
                                    c2.width = rr[1] - rr[0];
                                    c2.height = Math.max(1, bot - top + 1);
                                    c2.getContext('2d').drawImage(key, rr[0], top, c2.width, c2.height, 0, 0, c2.width, c2.height);
                                    return c2;
                                }
                                );
                                startDeco(sprites);
                            } catch (e) {}
                        }
                        ;
                        setTimeout( () => {
                            D.src = 'assets/bp_title_deco.png';
                        }
                        , 2200);
                    }
                    )();
                    // 인트로 끝난 뒤 로드
                    function startDeco(sprites) {
                        const dcv = $('decoCv');
                        if (!dcv || !sprites.length)
                            return;
                        const ctx2 = dcv.getContext('2d');
                        function fit() {
                            dcv.width = dcv.clientWidth || 360;
                            dcv.height = dcv.clientHeight || 600;
                        }
                        fit();
                        window.addEventListener('resize', fit);
                        const items = sprites.map( (sp, i) => ({
                            sp,
                            x: 40 + Math.random() * (dcv.width - 80),
                            y: -80 - i * 110,
                            vx: (Math.random() * 2 - 1) * 70,
                            vy: 0,
                            rot: (Math.random() * 2 - 1) * 0.4,
                            rv: (Math.random() * 2 - 1) * 2.5
                        }));
                        let last = performance.now();
                        let _decoPrev = 0;
                        (function loop(t) {
                            requestAnimationFrame(loop);
                            if ($('title').classList.contains('hidden')) {
                                last = t;
                                return;
                            }
                            if (t - _decoPrev < 33)
                                return;
                            // 30fps로 제한 (소리 끊김 방지)
                            _decoPrev = t;
                            const dt = Math.min(0.05, (t - last) / 1000);
                            last = t;
                            const W = dcv.width
                              , H = dcv.height;
                            ctx2.clearRect(0, 0, W, H);
                            const cap = Math.max(26, Math.min(W, H) * 0.10);
                            // 데코 크기: 화면 짧은 변의 10% 이내 (폰 비율 유지)
                            for (const o of items) {
                                const kk = Math.min(cap / o.sp.height, cap / o.sp.width)
                                  , hw = o.sp.width * kk / 2
                                  , hh = o.sp.height * kk / 2;
                                o.vy += 760 * dt;
                                o.x += o.vx * dt;
                                o.y += o.vy * dt;
                                o.rot += o.rv * dt;
                                if (o.y > H - hh) {
                                    o.y = H - hh;
                                    o.vy = -Math.abs(o.vy) * 0.82 - 60 - Math.random() * 90;
                                    o.vx += (Math.random() * 2 - 1) * 70;
                                    o.rv = (Math.random() * 2 - 1) * 3;
                                }
                                if (o.x < hw) {
                                    o.x = hw;
                                    o.vx = Math.abs(o.vx);
                                }
                                if (o.x > W - hw) {
                                    o.x = W - hw;
                                    o.vx = -Math.abs(o.vx);
                                }
                                ctx2.save();
                                ctx2.translate(o.x, o.y);
                                ctx2.rotate(o.rot);
                                ctx2.drawImage(o.sp, -hw, -hh, hw * 2, 46);
                                ctx2.restore();
                            }
                        }
                        )(performance.now());
                    }
                    applyLang();
                    show('title');
                    wireSiteBtns();
                    const EMBED = !!document.getElementById('happyHour');
                    // 시작화면1 안에 들어가 있는가
                    if (!EMBED)
                        titleIntro();
                    try {
                        window.HH = {
                            enter: function() {
                                window.__landLog = [];
                                window.__gunLog = [];
                                gunIdx = 0;
                                window.__introGo = true;
                                window.__introWait = false;
                                ['tMain', 'tHandle', 'tBest'].forEach(function(id) {
                                    var el = $(id);
                                    if (el) {
                                        el.classList.remove('land', 'hit');
                                        void el.offsetWidth;
                                    }
                                });
                                try {
                                    pongPrime();
                                } catch (e) {}
                                show('title');
                                playTitleBgm();
                                titleIntro();
                            },
                            leave: function() {
                                introToken++;
                                // 진행 중이던 인트로 타이머 전부 무효화
                                try {
                                    stopBgm(0);
                                } catch (e) {}
                                try {
                                    hhStop(0);
                                } catch (e) {}
                            } // 재생 중이던 곡을 확실히 끊는다
                        };
                    } catch (e) {}
                }
                )();

            }
            )();
        </script>
    </body>
</html>
