name: build-and-test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build
      - run: npm run check
      - run: node test/run.js
      - name: verify dist is committed and current
        run: git diff --exit-code -- dist/ || (echo "dist/pine-mini.user.js is stale — run npm run build and commit" && exit 1)
      - name: install playwright chromium
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: end to end — every game against the reference page
        run: node test/e2e.js --pages 4 --timeout 420
      - name: end to end — max mode (target = infinity)
        run: node test/e2e.js --max --pages 4 --timeout 480
      - uses: actions/upload-artifact@v4
        with:
          name: pine-mini.user.js
          path: dist/pine-mini.user.js
