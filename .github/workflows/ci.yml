name: build-and-test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build
      - run: npm run check
      - run: node test/run.js
      - name: verify dist is committed and current
        run: git diff --exit-code -- dist/ || (echo "dist/pine-mini.user.js is stale — run npm run build and commit" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: pine-mini.user.js
          path: dist/pine-mini.user.js
